name: Test delete-package-versions with num-old-versions-to-delete
on:
  workflow_dispatch:
jobs:
  test-num-old-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with num-old-versions-to-delete and invalid token
        id: action
        uses: .
        continue-on-error: true
        with:
          package-name: test-package
          package-type: npm
          num-old-versions-to-delete: "3"
          min-versions-to-keep: "1"
          token: "invalid-token-for-testing"

      - name: Assert action failed due to invalid token (API call required)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using num-old-versions-to-delete with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when trying to list versions with invalid token"
