name: Test delete-package-versions with delete-only-untagged-versions for container
on:
  workflow_dispatch:
jobs:
  test-delete-untagged-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with delete-only-untagged-versions for container package type
        id: action
        uses: .
        continue-on-error: true
        with:
          package-name: test-container-image
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: "0"
          token: "invalid-token-for-testing"

      - name: Assert action failed due to invalid token (API call required)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deleting untagged container versions with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when trying to list untagged container versions with invalid token"
