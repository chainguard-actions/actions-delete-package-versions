name: Test missing package-name for dynamic deletion

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When using dynamic deletion (num-old-versions-to-delete) without
      # providing package-name, the action should fail because it cannot
      # determine which package to query.
      - id: action
        uses: .
        continue-on-error: true
        with:
          num-old-versions-to-delete: "1"
          token: ${{ github.token }}

      - name: Assert action failed due to missing package-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when package-name is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when package-name is missing"
