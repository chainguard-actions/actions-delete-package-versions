name: Test delete-only-pre-release-versions with high min-versions-to-keep

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When delete-only-pre-release-versions=true AND num-old-versions-to-delete > 1,
      # checkInput() returns false → "Invalid input combination".
      # This validates that the combination guard works for the pre-release flag too.
      - id: action-invalid
        uses: .
        with:
          package-name: some-package
          package-type: npm
          num-old-versions-to-delete: "3"
          delete-only-pre-release-versions: "true"
        continue-on-error: true

      - name: Assert invalid pre-release + num-old-versions-to-delete combination fails
        env:
          OUTCOME: ${{ steps.action-invalid.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid pre-release input combination, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid pre-release + num-old-versions-to-delete combination"
