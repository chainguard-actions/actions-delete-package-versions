name: Test delete by package version IDs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          package-version-ids: "1234567"
          package-name: test-package
          package-type: container
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran (expected to fail with API error, not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the package version ID doesn't exist
          # or the token lacks permissions, but it should not fail due to missing inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
