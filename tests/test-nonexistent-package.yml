name: Test non-existent package name

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Attempt dynamic deletion with a package name that does not exist.
      # The action should fail because the GitHub API will return an error
      # (package not found).
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-name: "this-package-does-not-exist-xyz-12345"
          num-old-versions-to-delete: "1"
          token: ${{ github.token }}

      - name: Assert action failed for non-existent package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent package, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent package"
