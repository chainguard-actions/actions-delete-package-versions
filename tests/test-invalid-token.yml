name: Test delete-package-versions with invalid token
on:
  workflow_dispatch:
jobs:
  test-invalid-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid token and explicit package-version-ids
        id: action
        uses: .
        continue-on-error: true
        with:
          package-name: test-package
          package-type: npm
          package-version-ids: "1234567"
          token: "invalid-token-for-testing"

      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
