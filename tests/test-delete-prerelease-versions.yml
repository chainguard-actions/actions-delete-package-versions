name: Test delete-only-pre-release-versions flag

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the delete-only-pre-release-versions flag with a non-existent package.
      # The action should fail because the package does not exist in the registry.
      # This exercises the pre-release-only deletion code path.
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-name: "this-package-does-not-exist-xyz-prerelease"
          delete-only-pre-release-versions: "true"
          min-versions-to-keep: "0"
          token: ${{ github.token }}

      - name: Assert action failed for non-existent package (pre-release path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent package in pre-release mode, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent package in pre-release deletion mode"
