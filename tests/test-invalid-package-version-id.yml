name: Test invalid package version ID

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Attempt to delete a clearly non-existent package version ID.
      # The action should fail (non-zero exit) because the API will reject it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-version-ids: "000000000"
          token: ${{ github.token }}

      - name: Assert action failed on invalid package version ID
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid package version ID, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid package version ID"
