name: Test basic usage with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail with an API/auth error when given a fake token,
      # not a crash or missing-input error. We capture the outcome to assert it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          package-name: my-test-package
          package-type: npm
          num-old-versions-to-delete: "1"
          min-versions-to-keep: "0"
          token: fake-token-for-testing

      - name: Assert action failed (expected with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
